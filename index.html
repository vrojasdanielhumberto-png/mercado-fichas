<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercado de fichas · Achievers Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@700;800&display=swap">
<style>
  :root {
    --bg: #FBF9FD; --ink: #0B2654; --muted: #4A5170; --card: #FFFFFF; --line: #D9D3E6;
    --accent: #762DA6; --accent-ink: #FBF9FD; --soft: #EFE6F7; --turq: #5CD9DA; --yel: #FECE27; --org: #FE7F3D;
    --f-title: "Poppins", "Montserrat", sans-serif; --f-body: "DM Sans", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.4;
    padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .marca { font: 700 .75rem var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 800 1.7rem/1.1 var(--f-title); margin: 4px 0 6px; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-weight: 700; font-size: .9rem; margin: 14px 0 6px; }
  input, select { width: 100%; font: 500 1.05rem var(--f-body); color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px; min-height: 52px; }
  input:focus, select:focus, button:focus-visible { outline: 3px solid var(--org); outline-offset: 2px; }
  .btn { width: 100%; font: 700 1.05rem var(--f-body); min-height: 56px; margin-top: 18px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .link { background: none; border: 0; color: var(--accent); font: 700 .9rem var(--f-body); text-decoration: underline; cursor: pointer; padding: 8px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .hola { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hola h2 { font: 700 1.2rem var(--f-title); margin: 0; }
  .hola small { color: var(--muted); }
  .saldo { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
  .saldo b { font: 800 3rem/1 var(--f-title); font-variant-numeric: tabular-nums; }
  .saldo span { color: var(--muted); }
  .barra { height: 12px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 8px; }
  .barra i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .2s; }
  .fila { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .fila:first-child { border-top: 0; }
  .fila b { display: block; }
  .fila small { color: var(--muted); }
  .fila.propia { opacity: .55; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .ctl button { font: 700 1rem var(--f-body); width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; }
  .ctl button:disabled { opacity: .3; }
  .ctl input { width: 70px; min-height: 48px; text-align: center; font-weight: 700; padding: 6px; font-variant-numeric: tabular-nums; }
  .estado { margin-top: 12px; min-height: 1.4em; font-weight: 700; font-size: .95rem; }
  .estado.ok { color: #0B7A55; } .estado.err { color: #B4321A; } .estado.info { color: var(--muted); }
  .aviso { background: var(--yel); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-top: 12px; }
  .cargando { color: var(--muted); padding: 30px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="marca">Achievers Lab · Shark Tank Uniandino</div>
  <h1>Mercado de fichas</h1>
  <p class="sub">Tienes 50 monedas. Invierte en las ideas de los otros equipos, nunca en el tuyo.</p>

  <div id="cargando" class="cargando">Cargando…</div>

  <form id="entrar" hidden>
    <label for="nombre">Tu nombre</label>
    <input id="nombre" autocomplete="name" placeholder="Nombre y apellido">
    <label for="codigo">Tu código de estudiante</label>
    <input id="codigo" inputmode="numeric" autocomplete="off" placeholder="Ej.: 202212345">
    <label for="equipo">Tu equipo de hoy</label>
    <select id="equipo"><option value="">Escoge tu número de bandera</option></select>
    <button class="btn" type="submit" id="btnEntrar">Entrar</button>
    <p class="estado err" id="errEntrar" role="alert"></p>
  </form>

  <section id="perfil" hidden>
    <div class="card">
      <div class="hola">
        <div><h2 id="hNombre"></h2><small id="hEquipo"></small></div>
        <button class="link" id="salir" type="button">No soy yo</button>
      </div>
      <div class="saldo"><b id="restante">50</b><span>monedas por invertir</span></div>
      <div class="barra"><i id="barra" style="width:0%"></i></div>
      <div id="cerrado" class="aviso" hidden>El mercado está cerrado. Ya no se pueden cambiar las inversiones.</div>
    </div>
    <div class="card" id="lista"></div>
    <p class="estado info" id="guardado" role="status"></p>
  </section>
</div>

<script>window.SUPABASE_URL = "https://kkslqrumxbagwzwqmvbh.supabase.co"; window.SUPABASE_KEY = "sb_publishable_eXQyVvL8KHPn2uO0oPesbg_dEK-s9-a";</script>
<script>
(function () {
  var API = window.SUPABASE_URL || '';
  var KEY = 'mercado-fichas-codigo';
  var st = null, montos = {}, saving = false, pendiente = false, timer = null;
  var $ = function (id) { return document.getElementById(id); };

  function llamar(params) {
    var f, body;
    if (params.accion === 'estado') { f = 'fichas_estado'; body = { p_codigo: params.codigo || '' }; }
    else if (params.accion === 'entrar') { f = 'fichas_entrar'; body = { p_nombre: params.nombre, p_codigo: params.codigo, p_equipo: Number(params.equipo) || 0 }; }
    else { f = 'fichas_guardar'; body = { p_codigo: params.codigo, p_montos: JSON.parse(params.montos) }; }
    return fetch(API + '/rest/v1/rpc/' + f, {
      method: 'POST',
      headers: { 'apikey': window.SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error((d && d.message) || 'Error'); return d; }); });
  }
  function guardarCodigo(c) { try { localStorage.setItem(KEY, c); } catch (e) {} }
  function leerCodigo() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function borrarCodigo() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function nombreEq(n) {
    var q = (st && st.equipos || []).filter(function (x) { return x.numero === n; })[0];
    return 'Equipo ' + n + (q && q.nombre ? ': ' + q.nombre : '');
  }
  function total() { var t = 0; for (var k in montos) t += montos[k] || 0; return t; }

  function mostrarEntrar(equipos) {
    $('cargando').hidden = true; $('perfil').hidden = true; $('entrar').hidden = false;
    var sel = $('equipo'), v = sel.value;
    sel.innerHTML = '<option value="">Escoge tu número de bandera</option>' + (equipos || []).map(function (q) {
      return '<option value="' + q.numero + '">Equipo ' + q.numero + (q.nombre ? ': ' + esc(q.nombre) : '') + '</option>';
    }).join('');
    sel.value = v;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function pintar() {
    $('cargando').hidden = true; $('entrar').hidden = true; $('perfil').hidden = false;
    $('hNombre').textContent = 'Hola, ' + st.nombre.split(' ')[0];
    $('hEquipo').textContent = 'Tu equipo: ' + nombreEq(st.equipo);
    var usado = total(), quedan = st.presupuesto - usado;
    $('restante').textContent = quedan;
    $('barra').style.width = Math.min(100, usado / st.presupuesto * 100) + '%';
    $('cerrado').hidden = st.abierto;
    var a = document.activeElement, foco = a && a.dataset ? a.dataset.n : null;
    $('lista').innerHTML = st.equipos.map(function (q) {
      var n = q.numero;
      if (n === st.equipo) return '<div class="fila propia"><div><b>' + esc(nombreEq(n)) + '</b><small>Es tu equipo</small></div></div>';
      var v = montos[n] || 0, off = !st.abierto;
      return '<div class="fila"><div><b>' + esc(nombreEq(n)) + '</b></div><div class="ctl">' +
        '<button type="button" data-d="-5" data-n="' + n + '"' + (off || v <= 0 ? ' disabled' : '') + ' aria-label="Quitar 5">−5</button>' +
        '<input type="number" inputmode="numeric" min="0" max="50" data-n="' + n + '" value="' + v + '"' + (off ? ' disabled' : '') + ' aria-label="Monedas para ' + esc(nombreEq(n)) + '">' +
        '<button type="button" data-d="5" data-n="' + n + '"' + (off || quedan <= 0 ? ' disabled' : '') + ' aria-label="Poner 5 más">+5</button>' +
        '</div></div>';
    }).join('');
    if (foco) { var el = document.querySelector('input[data-n="' + foco + '"]'); if (el) { el.focus(); var l = el.value.length; try { el.setSelectionRange(l, l); } catch (e) {} } }
  }

  function poner(n, valor) {
    var otros = total() - (montos[n] || 0);
    var v = Math.max(0, Math.floor(Number(valor) || 0));
    var msg = '';
    if (otros + v > st.presupuesto) { v = st.presupuesto - otros; msg = 'Solo te quedaban ' + v + ' monedas para ese equipo.'; }
    if (v > 0) montos[n] = v; else delete montos[n];
    pintar();
    estado(msg || 'Guardando…', msg ? 'err' : 'info');
    clearTimeout(timer); timer = setTimeout(subir, 700);
  }
  function estado(t, c) { var e = $('guardado'); e.textContent = t; e.className = 'estado ' + (c || 'info'); }

  function subir() {
    if (saving) { pendiente = true; return; }
    saving = true; pendiente = false;
    var envio = JSON.stringify(montos);
    llamar({ accion: 'guardar', codigo: st.codigo, montos: envio }).then(function (d) {
      st = d;
      if (!pendiente) { montos = Object.assign({}, d.inversiones); pintar(); }
      estado('Guardado ✓ Te quedan ' + d.restante + ' monedas.', 'ok');
    }).catch(function (e) {
      estado(e.message || 'No se pudo guardar. Revisa tu conexión.', 'err');
    }).then(function () { saving = false; if (pendiente) subir(); });
  }

  $('lista').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-d]'); if (!b) return;
    var n = Number(b.dataset.n); poner(n, (montos[n] || 0) + Number(b.dataset.d));
  });
  $('lista').addEventListener('change', function (e) {
    var i = e.target.closest('input[data-n]'); if (!i) return;
    poner(Number(i.dataset.n), i.value);
  });

  $('entrar').addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = $('nombre').value.trim(), codigo = $('codigo').value.trim(), eq = $('equipo').value;
    $('errEntrar').textContent = '';
    if (!codigo) { $('errEntrar').textContent = 'Escribe tu código de estudiante.'; return; }
    $('btnEntrar').disabled = true; $('btnEntrar').textContent = 'Entrando…';
    llamar({ accion: 'entrar', nombre: nombre, codigo: codigo, equipo: eq }).then(function (d) {
      st = d; montos = Object.assign({}, d.inversiones); guardarCodigo(d.codigo); pintar();
    }).catch(function (err) {
      $('errEntrar').textContent = err.message || 'No se pudo entrar. Revisa tu conexión.';
    }).then(function () { $('btnEntrar').disabled = false; $('btnEntrar').textContent = 'Entrar'; });
  });

  $('salir').addEventListener('click', function () { borrarCodigo(); st = null; montos = {}; estado(''); arrancar(); });

  function refrescar() {
    if (!st || saving || timer && Date.now() < 0) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    llamar({ accion: 'estado', codigo: st.codigo }).then(function (d) {
      if (saving || pendiente) return;
      st = d; montos = Object.assign({}, d.inversiones); pintar();
    }).catch(function () {});
  }

  function arrancar() {
    if (!API) { $('cargando').textContent = 'La página aún no está conectada. Avísale al profesor.'; return; }
    var c = leerCodigo();
    $('cargando').hidden = false; $('entrar').hidden = true; $('perfil').hidden = true;
    llamar({ accion: 'estado', codigo: c }).then(function (d) {
      if (d.registrado) { st = d; montos = Object.assign({}, d.inversiones); pintar(); }
      else { if (c) borrarCodigo(); mostrarEntrar(d.equipos); }
    }).catch(function () { $('cargando').textContent = 'No se pudo conectar. Revisa tu internet y recarga la página.'; });
  }
  arrancar();
  setInterval(refrescar, 15000);
})();
</script>
</body>
</html>
