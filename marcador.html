<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador · Mercado de fichas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@700;800&display=swap">
<style>
  :root { --bg: #0B2654; --ink: #FBF9FD; --muted: #B9C2DE; --accent: #762DA6; --turq: #5CD9DA; --yel: #FECE27; --row: #13306A;
    --f-title: "Poppins", sans-serif; --f-body: "DM Sans", system-ui, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); padding: 28px max(16px, 3vw); min-height: 100vh; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; }
  .marca { font: 700 .9rem var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--turq); }
  h1 { font: 800 clamp(1.8rem, 4vw, 3rem)/1.1 var(--f-title); margin: 4px 0 0; }
  .stats { font-size: clamp(1rem, 1.6vw, 1.3rem); color: var(--muted); }
  .stats b { color: var(--ink); }
  .lista { margin-top: 26px; display: grid; gap: 12px; }
  .eq { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: center; background: var(--row); border-radius: 18px; padding: 14px 20px; }
  .pos { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font: 800 1.4rem var(--f-title); }
  .nom { font: 700 clamp(1.1rem, 2.2vw, 1.7rem) var(--f-title); min-width: 0; overflow-wrap: anywhere; }
  .barra { height: 12px; border-radius: 999px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 999px; background: var(--turq); transition: width .6s; }
  .tot { font: 800 clamp(1.6rem, 3.4vw, 2.8rem) var(--f-title); font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; margin-left: 10px; font: 700 .8rem var(--f-body); background: var(--yel); color: #0B2654; border-radius: 999px; padding: 2px 12px; vertical-align: middle; }
  .err { color: var(--yel); margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) { .barra i { transition: none; } }
</style>
</head>
<body>
  <div class="top">
    <div><div class="marca">Achievers Lab · Shark Tank Uniandino</div><h1>Mercado de fichas</h1></div>
    <div class="stats" id="stats">Cargando…</div>
  </div>
  <div class="lista" id="lista"></div>
  <p class="err" id="err"></p>
<script src="config.js"></script>
<script>
(function () {
  var API = window.SUPABASE_URL || '';
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function cargar() {
    if (!API) { document.getElementById('err').textContent = 'La página aún no está conectada.'; return; }
    fetch(API + '/rest/v1/rpc/fichas_marcador', { method: 'POST', headers: { 'apikey': window.SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}' }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error);
      document.getElementById('err').textContent = '';
      var eq = d.equipos.slice().sort(function (a, b) { return b.total - a.total || a.numero - b.numero; });
      var max = Math.max.apply(null, eq.map(function (q) { return q.total; })) || 0;
      var min = Math.min.apply(null, eq.map(function (q) { return q.total; }));
      document.getElementById('stats').innerHTML = '<b>' + d.invirtieron + '</b> de <b>' + d.registrados + '</b> ya invirtieron' + (d.abierto ? '' : ' · <b>Mercado cerrado</b>');
      document.getElementById('lista').innerHTML = eq.map(function (q) {
        var rank = 1 + eq.filter(function (o) { return o.total > q.total; }).length;
        return '<div class="eq"><div class="pos">' + rank + '</div><div class="nom">Equipo ' + q.numero + (q.nombre ? ': ' + esc(q.nombre) : '') +
          (max > 0 && q.total === min ? '<span class="tag">Va de último</span>' : '') +
          '<div class="barra"><i style="width:' + (max ? Math.max(2, q.total / max * 100) : 0) + '%"></i></div></div>' +
          '<div class="tot">' + q.total + '</div></div>';
      }).join('');
    }).catch(function () { document.getElementById('err').textContent = 'Sin conexión con la hoja. Reintentando…'; });
  }
  cargar(); setInterval(cargar, 5000);
})();
</script>
</body>
</html>
